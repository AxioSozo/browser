<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12">
  <title>Agent workspace: the agent space, the linked view from your window, identities and the agent channel</title>
  <desc>Two instances of the AxioSozo app. The agent profile (option A, the agent space) runs headless as a login item and holds every agent tab. The personal profile holds only the human's own tabs and identities; it never holds agent-owned tabs or agent cookies. A private link (option B) joins the two windows: the agent space sends a summary, sign-in prompts and, only while a linked view is open, the frames of one tab; the personal window sends view requests and, only after an explicit Take over, the human's input. No profile data crosses. Each profile has identities: one Gecko container plus one CEF request context each, so several accounts per site are signed in at once. Agents connect only to the agent space's Unix-socket endpoint and own their tabs. Callers open URLs as an identity through links.open. The legacy agent browser is the fallback until the final phase.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#555"/></marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#999"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c99a2e"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7646c4"/></marker>
  </defs>
  <rect width="1000" height="700" fill="#fbfbfc"/>

  <!-- Personal instance: your tabs only; option B shows the agent space through the link -->
  <rect x="20" y="20" width="330" height="372" rx="12" fill="#eef2fb" stroke="#4068c4" stroke-width="1.2"/>
  <text x="36" y="44" font-weight="700" font-size="13" fill="#1c1c1e">AxioSozo · personal profile</text>
  <text x="36" y="61" fill="#555">role personal · your tabs only · hosts block kept</text>
  <rect x="36" y="74" width="298" height="96" rx="8" fill="#fff" stroke="#c9d3ec"/>
  <text x="48" y="94" fill="#1c1c1e">Zen/Gecko parent · your window</text>
  <rect x="48" y="104" width="274" height="22" rx="5" fill="#f2f2f4"/><text x="56" y="119" fill="#333" font-size="11">your tabs (no agent-owned tabs, no agent cookies)</text>
  <rect x="48" y="132" width="274" height="22" rx="5" fill="#f4effc" stroke="#7646c4" stroke-dasharray="3 2"/><text x="56" y="147" fill="#4d2d86" font-size="11">linked views (B): frames from the agent space</text>
  <rect x="36" y="178" width="298" height="58" rx="8" fill="#fff" stroke="#c9d3ec"/>
  <text x="48" y="198" fill="#1c1c1e">Identities (yours only)</text>
  <circle cx="54" cy="218" r="5" fill="#37adff"/><text x="63" y="222" fill="#555" font-size="11">Work</text>
  <circle cx="110" cy="218" r="5" fill="#51cd00"/><text x="119" y="222" fill="#555" font-size="11">Client A</text>
  <rect x="36" y="244" width="298" height="40" rx="8" fill="#fff" stroke="#c9d3ec"/>
  <text x="48" y="268" fill="#1c1c1e">CEF host · one request context per identity</text>
  <rect x="36" y="292" width="298" height="34" rx="8" fill="#fff" stroke="#c9d3ec"/>
  <text x="48" y="314" fill="#1c1c1e">P4 endpoint · unchanged (agent-channel-v1)</text>
  <rect x="36" y="334" width="298" height="46" rx="8" fill="#fff" stroke="#7646c4"/>
  <text x="48" y="353" font-weight="600" fill="#1c1c1e">Link client (B)</text>
  <text x="48" y="370" fill="#555">Agents entry and list, linked views, prompts</text>

  <!-- Agent instance (option A, the agent space) -->
  <rect x="380" y="20" width="400" height="530" rx="12" fill="#f4effc" stroke="#7646c4" stroke-width="1.4"/>
  <text x="396" y="44" font-weight="700" font-size="13" fill="#1c1c1e">AxioSozo · agent space (login item)</text>
  <text x="396" y="61" fill="#555">role agent · headless until viewed · no import or sync</text>
  <rect x="396" y="74" width="368" height="58" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="408" y="96" fill="#1c1c1e">Zen/Gecko parent · every agent tab lives here</text>
  <text x="408" y="114" fill="#555">AgentTabRegistry: one owner per tab (s_…, human, system)</text>
  <rect x="396" y="140" width="368" height="76" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="408" y="160" fill="#1c1c1e">Identities · several accounts per site, all signed in</text>
  <circle cx="414" cy="180" r="5" fill="#37adff"/><text x="423" y="184" fill="#555" font-size="11">Work</text>
  <circle cx="466" cy="180" r="5" fill="#51cd00"/><text x="475" y="184" fill="#555" font-size="11">Client A</text>
  <circle cx="534" cy="180" r="5" fill="#ff9f00"/><text x="543" y="184" fill="#555" font-size="11">Client B</text>
  <circle cx="602" cy="180" r="5" fill="#ff4bda"/><text x="611" y="184" fill="#555" font-size="11">Client C</text>
  <circle cx="670" cy="180" r="5" fill="#af51f5"/><text x="679" y="184" fill="#555" font-size="11">Bot</text>
  <text x="408" y="204" fill="#555" font-size="11">each = one Gecko container + one CEF request context</text>
  <rect x="396" y="224" width="178" height="74" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="408" y="246" fill="#1c1c1e">Gecko tabs</text>
  <text x="408" y="264" fill="#555">WebDriver BiDi, in-process</text>
  <text x="408" y="281" fill="#555">no listener, no port</text>
  <rect x="586" y="224" width="178" height="74" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="598" y="246" fill="#1c1c1e">CEF host (agent)</text>
  <text x="598" y="264" fill="#555">DevTools messages over</text>
  <text x="598" y="281" fill="#555">the private stdin/stdout pipe</text>
  <rect x="396" y="306" width="368" height="74" rx="8" fill="#fff" stroke="#7646c4"/>
  <text x="408" y="328" font-weight="600" fill="#1c1c1e">Workspace endpoint · Unix socket 0600 · this Mac only</text>
  <text x="408" y="346" fill="#555">off until the Settings action · owner check · takeover ·</text>
  <text x="408" y="363" fill="#555">credentials refused · grants · identity permission</text>
  <rect x="396" y="388" width="178" height="86" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="408" y="410" fill="#1c1c1e">Egress rule (opt-in)</text>
  <text x="408" y="428" fill="#555">DoH for hosts-blocked</text>
  <text x="408" y="445" fill="#555">names, this profile only;</text>
  <text x="408" y="462" fill="#555">local names stay local</text>
  <rect x="586" y="388" width="178" height="86" rx="8" fill="#fff" stroke="#d8c9ef"/>
  <text x="598" y="410" fill="#1c1c1e">Sign-in status</text>
  <text x="598" y="428" fill="#555">probe per site and identity,</text>
  <text x="598" y="445" fill="#555">every 4 h; system tabs and</text>
  <text x="598" y="462" fill="#555">sign-in tabs agents never see</text>
  <rect x="396" y="482" width="368" height="56" rx="8" fill="#fff" stroke="#7646c4"/>
  <text x="408" y="503" font-weight="600" fill="#1c1c1e">Link endpoint (B) · Unix socket 0600 · not for agents</text>
  <text x="408" y="521" fill="#555">accepts only your own browser (same user, same signed app)</text>
  <line x1="580" y1="132" x2="580" y2="140" stroke="#999"/>
  <line x1="485" y1="216" x2="485" y2="224" stroke="#999"/>
  <line x1="675" y1="216" x2="675" y2="224" stroke="#999"/>
  <line x1="580" y1="298" x2="580" y2="306" stroke="#999"/>

  <!-- Agents and callers -->
  <rect x="820" y="230" width="160" height="44" rx="8" fill="#fff" stroke="#888"/>
  <text x="832" y="249" fill="#1c1c1e">Agent 1 (MCP)</text>
  <text x="832" y="265" fill="#555">bridge --workspace</text>
  <rect x="820" y="284" width="160" height="44" rx="8" fill="#fff" stroke="#888"/>
  <text x="832" y="303" fill="#1c1c1e">Agent 2 (MCP)</text>
  <text x="832" y="319" fill="#555">bridge --workspace</text>
  <rect x="820" y="338" width="160" height="44" rx="8" fill="#fff" stroke="#888"/>
  <text x="832" y="357" fill="#1c1c1e">Status consumer</text>
  <text x="832" y="373" fill="#555">status.read / CLI</text>
  <rect x="820" y="80" width="160" height="56" rx="8" fill="#fff" stroke="#888"/>
  <text x="832" y="100" fill="#1c1c1e">Dashboard / CLI</text>
  <text x="832" y="117" fill="#555">links.open: URL as</text>
  <text x="832" y="131" fill="#555">identity X</text>
  <path d="M820 252 C 800 252, 790 320, 766 330" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="794" y="246" fill="#555" font-size="11">s_1</text>
  <path d="M820 306 L 766 338" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="790" y="314" fill="#555" font-size="11">s_2</text>
  <path d="M820 360 C 800 360, 790 356, 766 352" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="786" y="376" fill="#555" font-size="11">read</text>
  <path d="M820 108 C 790 108, 800 300, 766 318" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M880 80 V 15 H 290 V 19" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="520" y="11" fill="#555" font-size="11">links.open into the personal profile</text>

  <!-- The link (option B) -->
  <path d="M396 500 C 364 500, 366 362, 336 360" fill="none" stroke="#c99a2e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <path d="M336 372 C 356 376, 356 520, 396 524" fill="none" stroke="#7646c4" stroke-width="1.4" marker-end="url(#arrow-purple)"/>
  <text x="36" y="406" fill="#8a6a1e" font-size="11">agent space → your window: summary (hosts,</text>
  <text x="36" y="419" fill="#8a6a1e" font-size="11">identity names, states), sign-in prompts;</text>
  <text x="36" y="432" fill="#8a6a1e" font-size="11">frames only while a view is open</text>
  <text x="36" y="450" fill="#4d2d86" font-size="11">your window → agent space: open/close view,</text>
  <text x="36" y="463" fill="#4d2d86" font-size="11">Give back; input only after explicit Take over</text>
  <text x="36" y="481" fill="#555" font-size="11">never: cookies, storage, passwords, history</text>

  <!-- Legacy fallback -->
  <rect x="820" y="520" width="160" height="70" rx="8" fill="#fff" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="832" y="542" fill="#777">Legacy agent browser</text>
  <text x="832" y="559" fill="#999">fallback until phase 19,</text>
  <text x="832" y="576" fill="#999">then retired</text>
  <path d="M900 328 L 900 520" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-soft)"/>
  <text x="908" y="500" fill="#999" font-size="11">if endpoint off</text>

  <!-- Human -->
  <rect x="20" y="500" width="330" height="120" rx="12" fill="#fff8e6" stroke="#c99a2e"/>
  <text x="36" y="524" font-weight="700" fill="#1c1c1e">Human, in their own window</text>
  <text x="36" y="544" fill="#555">sees which agents work and what they do</text>
  <text x="36" y="562" fill="#555">opens a live read-only view (renders only while open)</text>
  <text x="36" y="580" fill="#555">takes over explicitly; cookies stay in the agent space</text>
  <text x="36" y="598" fill="#555">signs in as an agent-space identity; grants actions</text>
  <path d="M326 500 L 326 384" fill="none" stroke="#c99a2e" stroke-width="1.3" marker-end="url(#arrow-amber)"/>

  <text x="380" y="580" fill="#555">Never shared between the two instances: profile directory,</text>
  <text x="380" y="597" fill="#555">cookies, storage, password store, add-ons, preferences,</text>
  <text x="380" y="614" fill="#555">Chromium profile. Identities are per profile. No TCP</text>
  <text x="380" y="631" fill="#555">listener, debugging port or WebSocket for agents.</text>
  <text x="20" y="680" fill="#999" font-size="11">docs/design/agent-workspace.md §3 · design only</text>
</svg>
